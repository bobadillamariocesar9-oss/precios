name: Test Java shopping comparison

on:
  push:
    branches:
      - feature/java-ai-shopping-advice
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests and compile application
        run: mvn -B test -Dtest=ShoppingAdviceServiceTest
