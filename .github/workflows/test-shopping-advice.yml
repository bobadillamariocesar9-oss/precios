name: Test Java shopping comparison

on:
  push:
    branches: [feature/java-ai-shopping-advice]
  pull_request:
    branches: [main]

concurrency:
  group: shopping-advice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Isolate new unit tests from legacy tests with stale Store.url references
        run: |
          mkdir -p /tmp/legacy-tests
          mv src/test/java /tmp/legacy-tests/java
          mkdir -p src/test/java/com/apiprecios/service
          cp /tmp/legacy-tests/java/com/apiprecios/service/ShoppingAdviceServiceTest.java src/test/java/com/apiprecios/service/
      - name: Compile application and run new focused unit tests
        run: mvn -B test -Dtest=ShoppingAdviceServiceTest
